name: Pulse Keep-Alive & Monitoring Runner

on:
  schedule:
    # Trigger every 5 minutes on standard boundaries (:00, :05, :10, :15...)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Prevent concurrent overlapping workflow executions
concurrency:
  group: pulse-monitoring-engine
  cancel-in-progress: false

# Restrict default repository permissions to minimum read-only
permissions:
  contents: read

jobs:
  monitor:
    name: Test, Build & Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run automated unit tests
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: go test -v ./...

      - name: Build monitoring executable
        run: go build -v -o bin/pulse ./cmd/pulse

      - name: Execute keep-alive probes
        if: ${{ env.DATABASE_URL != '' }}
        run: ./bin/pulse
